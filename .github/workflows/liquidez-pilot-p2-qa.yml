name: Liquidez P2 Technical Regression (SELF_TEST)
on:
  pull_request:
    branches: [pilot/liquidez-001]
    paths: ['.github/workflows/liquidez-pilot-p2-qa.yml', 'src/**', 'test/**', 'docs/LIQ-CODEX-003.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p2-technical-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full suite including Needs, Position and 002A contracts
        run: node --test
      - name: Verify P2 test files available
        run: |
          test -f test/liq-codex-002.test.js
          test -f test/liq-codex-002a.test.js
          test -f test/liq-codex-003.test.js
